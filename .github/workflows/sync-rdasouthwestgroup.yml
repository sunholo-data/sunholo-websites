name: Sync rdasouthwestgroup site

on:
  push:
    branches: [main]
    paths:
      - 'sites/ZO8wLHpvFcNFlorlcrlNeGmnuPE3/home-page-riding-for-disabled-south-west-group-established-i-7m9sk/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RDASOUTHWESTGROUP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Sync to rdasouthwestgroup repo
        run: |
          git clone git@github.com:sunholo-data/rdasouthwestgroup.git /tmp/rdarepo
          rsync -av --delete \
            --exclude='.git' --exclude='CNAME' --exclude='README.md' \
            sites/ZO8wLHpvFcNFlorlcrlNeGmnuPE3/home-page-riding-for-disabled-south-west-group-established-i-7m9sk/ \
            /tmp/rdarepo/
          cd /tmp/rdarepo
          git config user.email "ailang-agent@sunholo.com"
          git config user.name "AILANG Sync"
          git add -A
          git diff --staged --quiet && echo "No changes to sync" || (
            git commit -m "Sync: portal update via Claudette" &&
            git push
          )
